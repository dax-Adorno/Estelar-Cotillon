[tool.black]
line-length = 88
exclude = '''
/(
    \.venv
  | migrations
  | __pycache__
)/
'''

[tool.mypy]
python_version = "3.14"
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
check_untyped_defs = true
exclude = [
    ".venv",
    "migrations",
]

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.coverage.run]
source = ["apps", "config"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "manage.py",
    "config/asgi.py",
    "config/wsgi.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 0