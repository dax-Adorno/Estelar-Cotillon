name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend quality checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server_django

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Black
        run: black --check apps config tests

      - name: Run Pylint
        run: pylint apps config tests

      - name: Run Mypy
        run: mypy apps config

      - name: Run backend tests with coverage
        run: |
          coverage run -m pytest
          coverage report

  frontend:
    name: Frontend quality checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Run frontend tests
        run: pnpm test

      - name: Run frontend coverage
        run: pnpm test:coverage

      - name: Build frontend
        run: pnpm build

  docker:
    name: Production container validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Docker Compose
        run: docker compose config

      - name: Validate production Docker Compose
        run: docker compose --env-file .env.production.example -f docker-compose.prod.yml config --quiet

      - name: Build production images
        run: docker compose --env-file .env.production.example -f docker-compose.prod.yml build

  security:
    name: Dependency and deployment security
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: security-check-only-7f4a2b8d1c6e9a3f5b0d8c2e7a4f1b6d9c3e5a8f
      DJANGO_ALLOWED_HOSTS: tienda.example.com
      CORS_ALLOWED_ORIGINS: https://tienda.example.com
      CSRF_TRUSTED_ORIGINS: https://tienda.example.com
      FRONTEND_URL: https://tienda.example.com
      DATABASE_ENGINE: postgres
      POSTGRES_DB: estelart_db
      POSTGRES_USER: estelart_user
      POSTGRES_PASSWORD: ci-only-password
      DJANGO_SECURE_SSL_REDIRECT: "True"
      DJANGO_SESSION_COOKIE_SECURE: "True"
      DJANGO_CSRF_COOKIE_SECURE: "True"
      DJANGO_SECURE_HSTS_SECONDS: "31536000"
      DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: "True"
      DJANGO_SECURE_HSTS_PRELOAD: "True"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Audit backend and validate Django deployment
        working-directory: server_django
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pip-audit
          python manage.py check --deploy --fail-level WARNING
          python -m pip_audit -r requirements.txt

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Audit frontend dependencies
        working-directory: client
        run: pnpm audit --audit-level high
